[[collection]]
type = "art"
img = "/img/pycon.png"
title = "Serverless Orchestration: Exploring the Future of Workflow Automation"
link = "slides/2025_PyCon_ServerlessOrchestration.pdf"
subtitle = "PyCon & PyData DE 2025"
content = "Orchestration is a typical challenge in the data engineering world. Scheduling your data transformation jobs via CRON-jobs is cumbersome and error-prone. Furthermore, with an increasing number of jobs to manage it gets in-oversee able. Tools like Apache Airflow, Dagster, Luigi, and Prefect are known for addressing these challenges but often require additional resources or investment. With the advent of serverless orchestration tools, many of these disadvantages are mitigated, offering a more streamlined and cost-effective solution. Beyond data engineering, serverless orchestration holds substantial potential for classical software engineering, especially as organizations explore serverless approaches for optimizing efficiency and reducing overhead."
footer = ""


[[collection]]
type = "art"
img = "/img/vienna_de_meetup.png"
title = "Microsoft Fabric: Data Engineering Game Changer or Just a Fad?"
link = "slides/2024_10_vienna_data_eng_meetup.pdf"
subtitle = "Vienna Data Engineering Meetup, Oct 2024"
content = "Microsoft Fabric is a new end-to-end analytics and data platform designed for enterprises that need a unified solution. It promises to span the entire data lifecycle, including data movement, processing, ingestion, transformation, real-time event routing, and report building. At Cloudflight, we started using Microsoft Fabric to build our internal data platform. This talk will cover our experiences, the issues we encountered, the best practices we learned, and how we managed to work with Microsoft Fabric. At the end, let's have a joint discussion and look forward to whether Fabric is here to stay or whether it will fade away."
footer = ""


[[collection]]
type = "art"
img = "/img/data2day2019_noyear.svg"
title = "Von Chaos zu Erfolg: Datenqualität beherrschen"
link = "slides/Loefflath_Bossenmaier__Von_Chaos_zu_Erfolg_Datenqualitaet_beherrschen.pdf"
subtitle = "data2day 2023"
content = "This talk covers the challenges of working with messy and complex data during data processing. We introduce the most common sources and types of data quality problems. We then look at the specific methods and techniques used to identify, analyze and resolve such issues, such as data quarantining, data testing and data contracts. The aim is to introduce strategies, best practices and tools for ensuring data quality."
footer = ""

