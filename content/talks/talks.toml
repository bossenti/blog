[[collection]]
type = "art"
img = "/img/pyconde_bear.png"
title = "Apache StreamPipes for Pythonistas - IIoT data handling made easy!"
link = "slides/2023_pycon_streampipes_pythonistas.pdf"
subtitle = "PyCon & PyData DE 2023"
content = "The industrial environment offers a lot of interesting use cases for data enthusiasts. There are myriads of interesting challenges that can be solved by data scientists. However, collecting industrial data in general and industrial IoT (IIoT) data in particular, is cumbersome and not really appealing for anyone who just wants to work with data. Apache StreamPipes addresses this pitfall and allows anyone to extract data from IIoT data sources without messing around with (old-fashioned) protocols. In addition, StreamPipes newly developed Python client now gives Pythonistas the ability to programmatically access and work with them in a Pythonic way."
footer = ""
